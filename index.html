<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정원이의 운세</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #060913;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(99, 102, 241, 0.15) 0%, transparent 45%);
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover {
            border-color: rgba(56, 189, 248, 0.35);
            box-shadow: 0 25px 60px rgba(14, 165, 233, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen relative antialiased selection:bg-cyan-500 selection:text-white pb-16">

    <!-- 상단 네비게이션 바 -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/70 border-b border-white/5 px-4 sm:px-8 py-3.5">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                <span class="font-bold tracking-wider text-sm sm:text-base text-slate-200">정원이의 운세</span>
            </div>
            <div class="flex items-center gap-4 text-xs sm:text-sm text-slate-400 font-medium">
                <a href="#fortune" class="hover:text-cyan-400 transition-colors">운세 뽑기</a>
                <a href="#recommend" class="hover:text-cyan-400 transition-colors">오늘의 추천</a>
                <a href="#guestbook" class="hover:text-cyan-400 transition-colors">한마디</a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl w-full mx-auto px-4 sm:px-8 pt-8 sm:pt-12 space-y-8 relative z-10">
        
        <!-- 1. 헤더 섹션 -->
        <header class="glass-panel rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/5 border border-white/10 text-cyan-300 text-xs font-semibold tracking-wider uppercase mb-4">
                TODAY'S FORTUNE
            </div>

            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-3">
                <span class="gradient-text">정원이의 운세</span>
            </h1>
            <p class="text-sm sm:text-base text-slate-400 max-w-md mx-auto leading-relaxed">
                오늘 하루는 어떨지 가볍게 확인해 보세요.
            </p>
        </header>

        <!-- 2. 오늘의 운세 뽑기 섹션 -->
        <section id="fortune" class="glass-panel rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden">
            <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">오늘의 운세 뽑기</h2>
            <p class="text-xs sm:text-sm text-slate-400 mb-7">버튼을 누르면 오늘의 운세와 행운 지수가 나옵니다.</p>

            <!-- 운세 결과 창 -->
            <div id="drawDisplay" class="bg-slate-950/80 border border-white/10 rounded-2xl p-6 sm:p-8 mb-6 min-h-[130px] flex flex-col items-center justify-center transition-all">
                <p class="text-slate-400 text-sm">아래 버튼을 눌러 오늘의 운세를 뽑아보세요.</p>
            </div>

            <!-- 행운 지수 게이지 (뽑기 후 표시) -->
            <div id="luckMeterContainer" class="hidden max-w-md mx-auto mb-7 space-y-2">
                <div class="flex justify-between text-xs font-semibold">
                    <span class="text-slate-400">오늘의 행운 지수</span>
                    <span id="luckPercentText" class="text-cyan-400">0%</span>
                </div>
                <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                    <div id="luckBar" class="h-full bg-gradient-to-r from-cyan-400 to-indigo-500 rounded-full transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>

            <button onclick="runLuckyDraw()" class="w-full sm:w-auto px-10 py-3.5 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold text-base rounded-2xl shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                운세 뽑기
            </button>
        </section>

        <!-- 3. 오늘의 추천 & 한마디 (2단 그리드) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 오늘의 랜덤 추천 (점심 메뉴 / 행운 색깔) -->
            <section id="recommend" class="glass-panel rounded-3xl p-7 flex flex-col justify-between">
                <div>
                    <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">DAILY PICK</span>
                    <h2 class="text-xl font-bold text-white mt-1 mb-4">오늘의 럭키 아이템</h2>
                    <div class="bg-slate-950/70 border border-white/5 rounded-2xl p-5 mb-5 space-y-3 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">추천 메뉴</span>
                            <span id="recFood" class="font-bold text-white">-</span>
                        </div>
                        <div class="border-t border-white/5"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">행운의 컬러</span>
                            <span id="recColor" class="font-bold text-cyan-300">-</span>
                        </div>
                        <div class="border-t border-white/5"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400">행운의 숫자</span>
                            <span id="recNumber" class="font-bold text-indigo-300">-</span>
                        </div>
                    </div>
                </div>

                <button onclick="pickDailyItems()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-slate-200 font-semibold text-sm transition-all active:scale-95">
                    다시 추천받기
                </button>
            </section>

            <!-- 방문자 한마디 남기기 -->
            <section id="guestbook" class="glass-panel rounded-3xl p-7 flex flex-col justify-between">
                <div>
                    <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">GUESTBOOK</span>
                    <h2 class="text-xl font-bold text-white mt-1 mb-4">한마디 남기기</h2>
                    
                    <div id="messageList" class="space-y-2.5 max-h-40 overflow-y-auto pr-1 mb-4">
                        <div class="bg-slate-950/70 border border-white/5 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-300 flex justify-between items-center">
                            <span>오늘 운세 잘 나오네 ㅋㅋ</span>
                            <span class="text-[11px] text-slate-500">방문자</span>
                        </div>
                        <div class="bg-slate-950/70 border border-white/5 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-300 flex justify-between items-center">
                            <span>사이트 깔끔하게 잘 만들었다!</span>
                            <span class="text-[11px] text-slate-500">친구</span>
                        </div>
                    </div>
                </div>

                <form onsubmit="addMessage(event)" class="flex gap-2">
                    <input id="msgInput" type="text" maxlength="40" placeholder="짧은 한마디를 남겨보세요..." class="flex-1 bg-slate-950/90 border border-white/10 focus:border-cyan-400 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition-colors">
                    <button type="submit" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-semibold text-sm rounded-xl border border-white/10 transition-colors shrink-0">
                        등록
                    </button>
                </form>
            </section>

        </div>

    </main>

    <!-- 하단 푸터 -->
    <footer class="max-w-3xl mx-auto px-4 mt-14 text-center text-xs text-slate-500">
        <p>© 2026 정원이의 운세.</p>
    </footer>

    <script>
        // 깔끔하고 기분 좋은 운세 문장 모음
        const fortunes = [
            { text: "오늘 계획했던 일들이 생각보다 훨씬 순조롭게 풀리는 하루가 됩니다.", score: 92 },
            { text: "잠깐의 휴식 속에서 기분 좋은 아이디어와 여유를 찾게 됩니다.", score: 85 },
            { text: "평범하게 지나갈 수 있는 하루 속에서 뜻밖의 작은 행운을 마주칩니다.", score: 90 },
            { text: "좋아하는 음악이나 음식과 함께 스트레스가 말끔히 사라지는 날입니다.", score: 88 },
            { text: "주변 사람들과의 가벼운 대화 속에서 웃을 일이 많이 생깁니다.", score: 87 },
            { text: "오늘 차분하게 해낸 작은 노력이 나중에 기분 좋은 결과로 돌아옵니다.", score: 94 },
            { text: "마음이 한결 가벼워지고 집중력이 높아져 무엇이든 잘 해낼 수 있습니다.", score: 95 },
            { text: "기분 좋은 소식이 들려오거나 기다리던 일이 해결되는 날입니다.", score: 91 },
            { text: "자신감을 가지고 행동하면 좋은 흐름이 자연스럽게 따라옵니다.", score: 89 },
            { text: "오늘 하루는 특별히 걱정할 일 없이 편안하고 안정적으로 흘러갑니다.", score: 84 }
        ];

        function runLuckyDraw() {
            const display = document.getElementById('drawDisplay');
            const meterContainer = document.getElementById('luckMeterContainer');
            const luckBar = document.getElementById('luckBar');
            const luckPercentText = document.getElementById('luckPercentText');

            display.innerHTML = `<span class="text-cyan-400 text-sm font-medium animate-pulse">오늘의 운세를 확인하는 중...</span>`;

            setTimeout(() => {
                const picked = fortunes[Math.floor(Math.random() * fortunes.length)];
                display.innerHTML = `
                    <p class="text-white font-bold text-base sm:text-xl leading-relaxed break-keep">
                        "${picked.text}"
                    </p>
                `;

                meterContainer.classList.remove('hidden');
                luckPercentText.innerText = picked.score + '%';
                luckBar.style.width = '0%';
                setTimeout(() => {
                    luckBar.style.width = picked.score + '%';
                }, 50);
            }, 300);
        }

        // 오늘의 럭키 아이템 (메뉴, 컬러, 숫자) 랜덤 추천
        const foods = ["제육볶음", "김치찌개", "돈까스", "초밥", "떡볶이", "햄버거", "파스타", "국밥", "치킨", "라멘"];
        const colors = ["네이비", "스카이블루", "화이트", "블랙", "민트", "베이지", "그레이", "올리브 그린"];

        function pickDailyItems() {
            const food = foods[Math.floor(Math.random() * foods.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const num = Math.floor(Math.random() * 99) + 1;

            document.getElementById('recFood').innerText = food;
            document.getElementById('recColor').innerText = color;
            document.getElementById('recNumber').innerText = num;
        }

        // 페이지 열릴 때 기본 추천값 한 번 세팅
        window.addEventListener('DOMContentLoaded', pickDailyItems);

        // 방명록 한마디 추가 로직
        function addMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const list = document.getElementById('messageList');
            const item = document.createElement('div');
            item.className = "bg-cyan-950/40 border border-cyan-500/30 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-200 flex justify-between items-center";
            
            const spanText = document.createElement('span');
            spanText.textContent = text;
            
            const spanTag = document.createElement('span');
            spanTag.className = "text-[11px] text-cyan-400 shrink-0 ml-2";
            spanTag.textContent = "방금 전";

            item.appendChild(spanText);
            item.appendChild(spanTag);
            list.prepend(item);
            input.value = "";
        }
    </script>
</body>
</html>
